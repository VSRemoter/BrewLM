<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <!-- base: hot red-orange sweeping to amber -->
    <linearGradient id="base" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#FF4B1F"/>
      <stop offset="0.55" stop-color="#FF5E14"/>
      <stop offset="1" stop-color="#FF8A12"/>
    </linearGradient>
    <!-- soft pink bloom, top-right -->
    <radialGradient id="pink" cx="0.98" cy="0.02" r="0.55">
      <stop offset="0" stop-color="#FF6F7A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF6F7A" stop-opacity="0"/>
    </radialGradient>
    <!-- warm amber glow, lower-right -->
    <radialGradient id="amber" cx="0.9" cy="0.75" r="0.5">
      <stop offset="0" stop-color="#FF9E1B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF9E1B" stop-opacity="0"/>
    </radialGradient>
    <!-- deep red shadow, bottom-left -->
    <radialGradient id="ember" cx="0" cy="1" r="0.5">
      <stop offset="0" stop-color="#C8261A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C8261A" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8A1E05" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px tile centered on a 1024 canvas -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#base)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#amber)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#pink)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#ember)"/>
  </g>

  <!-- white mug -->
  <g fill="#FFFFFF" filter="url(#lift)" transform="translate(-56 12)">
    <!-- steam -->
    <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round">
      <path d="M452 368 C 420 334, 484 306, 452 262"/>
      <path d="M560 368 C 528 334, 592 306, 560 262"/>
    </g>
    <!-- body -->
    <path d="M318 444 C 318 430, 330 418, 344 418 H 668 C 682 418, 694 430, 694 444 V 640 C 694 708, 640 762, 572 762 H 440 C 372 762, 318 708, 318 640 Z"/>
    <!-- handle -->
    <path fill-rule="evenodd" d="M676 468 H 742 C 806 468, 846 512, 846 576 C 846 640, 806 684, 742 684 H 676 V 626 H 738 C 770 626, 788 606, 788 576 C 788 546, 770 526, 738 526 H 676 Z"/>
  </g>
</svg>
