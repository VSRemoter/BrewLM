<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fafafa">
<meta name="referrer" content="no-referrer">
<title>BrewLM</title>
<style>
  :root {
    /* Overridden by JS theme switcher; defaults = "original" (desktop default). */
    --bg: #fafafa; --panel: #ffffff; --panel2: #eeeeee; --edge: #e5e5e5;
    --ink: #171717; --ink2: #525252; --ink3: #8a8a8a; --accent: #171717;
    --good: #15803d; --bad: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background .2s, color .2s; }
  #app { max-width: 680px; margin: 0 auto; padding: 14px 14px 110px;
    padding-top: calc(14px + env(safe-area-inset-top)); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
  .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .brand h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .brand .ro-pill { margin-left: auto; font-size: 11px; color: var(--accent);
    border: 1px solid var(--edge); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  body.readonly .write-only { display: none !important; }
  .btn { display: inline-block; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn-danger { color: var(--bad); }
  .btn:disabled { opacity: .5; }
  .search, .field { width: 100%; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 15px;
    outline: none; margin-bottom: 10px; }
  .search { border-radius: 999px; }
  .search::placeholder, .field::placeholder { color: var(--ink3); }
  .search:focus, .field:focus { border-color: var(--accent); }
  textarea.field { min-height: 110px; resize: vertical; font-family: inherit; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px; display: block; width: 100%; text-align: left;
    color: var(--ink); cursor: pointer; position: relative; }
  .card:active { background: var(--panel2); }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card p { margin: 0; color: var(--ink2); font-size: 13px; }
  .card .date { color: var(--ink3); font-size: 11.5px; margin-top: 6px; display: block; }
  .card .menu { position: absolute; top: 10px; right: 12px; color: var(--ink3);
    font-size: 20px; padding: 2px 8px; }
  .back { color: var(--accent); background: none; border: none; font-size: 15px;
    padding: 8px 0; margin-bottom: 6px; cursor: pointer; }
  .sec { color: var(--ink3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
    margin: 20px 0 8px; }
  .pill { display: inline-block; font-size: 10.5px; color: var(--accent); border: 1px solid var(--edge);
    border-radius: 999px; padding: 1px 7px; margin-left: 8px; vertical-align: 2px; }
  audio { width: 100%; margin-top: 10px; display: block; }
  details { margin-top: 8px; }
  summary { color: var(--accent); font-size: 13.5px; cursor: pointer; }
  .body-md { font-size: 14.5px; color: var(--ink); }
  .body-md h1, .body-md h2, .body-md h3 { margin: 16px 0 6px; line-height: 1.25; }
  .body-md h1 { font-size: 19px; } .body-md h2 { font-size: 17px; } .body-md h3 { font-size: 15px; }
  .body-md p { margin: 8px 0; color: var(--ink2); }
  .body-md a { color: var(--accent); }
  .body-md code { background: var(--panel2); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .body-md pre { background: var(--panel2); border: 1px solid var(--edge); border-radius: 10px;
    padding: 10px; overflow-x: auto; font-size: 12.5px; }
  .body-md pre code { background: none; padding: 0; }
  .body-md ul, .body-md ol { margin: 8px 0; padding-left: 22px; color: var(--ink2); }
  .body-md li { margin: 3px 0; }
  .body-md blockquote { border-left: 3px solid var(--edge); margin: 8px 0; padding-left: 12px; color: var(--ink3); }
  .flip { perspective: 600px; text-align: center; font-family: inherit; }
  .flip .inner { transition: transform .3s; transform-style: preserve-3d; display: grid; min-height: 120px; }
  .flip .inner > * { grid-area: 1 / 1; }
  .flip.flipped .inner { transform: rotateY(180deg); }
  .flip .face { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 6px 4px; text-align: center; font-size: 15.5px; line-height: 1.55;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip .face .hint { font-size: 11.5px; color: var(--ink3); }
  .flip .back-face { transform: rotateY(180deg); color: var(--ink2); font-size: 14.5px; }
  .q-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--edge); background: var(--panel2);
    color: var(--ink); font-size: 14.5px; cursor: pointer; }
  .q-opt.correct { border-color: var(--good); background: rgba(94,166,114,.15); }
  .q-opt.wrong { border-color: var(--bad); background: rgba(201,106,94,.15); }
  .q-exp { margin-top: 8px; font-size: 13px; color: var(--ink2); border-top: 1px dashed var(--edge);
    padding-top: 8px; }
  .empty { color: var(--ink3); font-size: 13.5px; }
  .err { color: var(--bad); padding: 30px 0; text-align: center; }
  .score { float: right; font-size: 12px; color: var(--accent); }
  /* Tabs */
  .tabs { display: flex; gap: 6px; margin: 10px 0 14px; }
  .tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; font-size: 14px;
    cursor: pointer; border: 1px solid var(--edge); background: var(--panel); color: var(--ink2); }
  .tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  /* Chat */
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; margin-bottom: 10px; font-size: 14.5px; }
  .msg.user { margin-left: auto; background: var(--accent); color: var(--bg); border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--panel); border: 1px solid var(--edge); border-bottom-left-radius: 4px; }
  .msg.bot .body-md { font-size: 14.5px; }
  .msg.thinking { color: var(--ink3); font-style: italic; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--bg); border-top: 1px solid var(--edge);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .composer .row { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; }
  .composer textarea { flex: 1; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); border-radius: 18px; padding: 10px 14px; font-size: 15px; max-height: 110px;
    outline: none; resize: none; font-family: inherit; }
  .composer button { border-radius: 999px; border: none; background: var(--accent); color: var(--bg);
    padding: 0 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .composer button:disabled { opacity: .5; }
  #app.in-chat { padding-bottom: 100px; }
  /* Sheets & misc */
  .sheet { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; }
  .sheet > div { background: var(--panel); border-radius: 18px 18px 0 0; width: 100%;
    max-width: 680px; margin: 0 auto; padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
    max-height: 80vh; overflow-y: auto; }
  .sheet h3 { margin: 0 0 10px; }
  .sheet .btn { margin: 0 8px 8px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--edge); background: var(--panel2); color: var(--ink2);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
  .chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .job-pill { background: var(--panel2); border: 1px dashed var(--edge); border-radius: 12px;
    padding: 10px 14px; font-size: 13px; color: var(--ink2); margin-bottom: 10px; }
  .src-item { cursor: default; }
  .src-item .t { font-size: 14px; }
  /* Theme dock */
  .themes { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 50;
    display: flex; gap: 9px; padding: 9px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--edge);
    box-shadow: 0 6px 24px rgba(0,0,0,.22); }
  .themes.hidden { display: none; }
  .tdot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; padding: 2px; background-clip: content-box; }
  .tdot.active { border-color: var(--accent); transform: scale(1.12); }
  /* Pairing */
  .pair-wrap { max-width: 380px; margin: 12vh auto 0; text-align: center; }
  .pin { font-size: 24px !important; letter-spacing: .35em; text-align: center; }
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
"use strict";
const $app = document.getElementById('app');
const SEG = location.pathname.split('/').filter(Boolean);
const MODE = SEG[0];                 // 'p' (pairing) | 'd' (device)
const CRED = SEG[1] || '';
const BASE = `/${MODE}/${CRED}`;
const KEY_STORE = 'brewlm-device-key';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function apiRaw(path, opts) {
  const r = await fetch(`${BASE}/api${path}`, opts);
  return r;
}
async function api(path, opts) {
  const r = await apiRaw(path, opts);
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { msg = (await r.json()).error || msg; } catch {}
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return r.json();
}
let SCOPE = 'full'; // device's access level, from /preferences ('read' hides all write UI)
function applyScopeClass() { document.body.classList.toggle('readonly', SCOPE !== 'full'); }

const post = (path, body) => {
  if (SCOPE !== 'full') return Promise.reject(new Error('This device is read-only.'));
  return api(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {})
  });
};

/* ------------------------------- theming -------------------------------- */
const M_THEMES = {
  original: { name:'Original', scheme:'light', font:null, v:{ bg:'#fafafa', panel:'#ffffff', panel2:'#eeeeee', edge:'#e5e5e5', ink:'#171717', ink2:'#525252', ink3:'#8a8a8a', accent:'#171717' } },
  midnight: { name:'Midnight', scheme:'dark', font:null, v:{ bg:'#0e0e11', panel:'#17171b', panel2:'#202025', edge:'#2b2b31', ink:'#f4f4f5', ink2:'#a1a1aa', ink3:'#6e6e78', accent:'#f4f4f5' } },
  forest:   { name:'Forest',   scheme:'dark', font:null, v:{ bg:'#0c1410', panel:'#121f18', panel2:'#192b21', edge:'#24402f', ink:'#e8f2ea', ink2:'#9cb8a6', ink3:'#64826f', accent:'#3ecf8e' } },
  ocean:    { name:'Ocean',    scheme:'dark', font:null, v:{ bg:'#081120', panel:'#0f1c31', panel2:'#16283f', edge:'#223a5c', ink:'#e7effc', ink2:'#9ab1d1', ink3:'#61789c', accent:'#4da2ff' } },
  copper:   { name:'Copper',   scheme:'dark', font:null, v:{ bg:'#170e08', panel:'#221509', panel2:'#2f1e0e', edge:'#432c17', ink:'#f6ebdf', ink2:'#c9a88c', ink3:'#92725a', accent:'#e8853d' } },
  wine:     { name:'Wine',     scheme:'dark', font:null, v:{ bg:'#140a10', panel:'#1f1119', panel2:'#2b161f', edge:'#41232f', ink:'#f7e9f0', ink2:'#c09aac', ink3:'#8a6175', accent:'#d85674' } },
  rose:     { name:'Rose',     scheme:'light',font:null, v:{ bg:'#fdf1f6', panel:'#ffffff', panel2:'#f8e2ec', edge:'#f2d3e1', ink:'#3f1a2d', ink2:'#93536f', ink3:'#c18ba6', accent:'#ec4899' } },
  matrix:   { name:'Matrix',   scheme:'dark', font:'"SF Mono", ui-monospace, Menlo, monospace',
              v:{ bg:'#010603', panel:'#04140b', panel2:'#082014', edge:'#11452a', ink:'#a3f7bf', ink2:'#52b96f', ink3:'#2d7a44', accent:'#22e05c' } },
  lilac:    { name:'Lilac',    scheme:'light',font:null, v:{ bg:'#f5f3fc', panel:'#ffffff', panel2:'#ece7fa', edge:'#e4ddf6', ink:'#2d2342', ink2:'#6e5f99', ink3:'#a89ccc', accent:'#7c5cff' } },
  lagoon:   { name:'Lagoon',   scheme:'light',font:null, v:{ bg:'#effaf8', panel:'#ffffff', panel2:'#e2f3f0', edge:'#d3ece8', ink:'#123b39', ink2:'#4d7c76', ink3:'#93bdb6', accent:'#0db5a6' } },
  sunset:   { name:'Sunset',   scheme:'dark', font:null, v:{ bg:'#1f1016', panel:'#2a161d', panel2:'#331a22', edge:'#46222d', ink:'#f7e8dd', ink2:'#c4a0a5', ink3:'#8a5f68', accent:'#ff9e42' } },
  candy:    { name:'Candy',    scheme:'dark', font:null, v:{ bg:'#0d0a1f', panel:'#17122e', panel2:'#1f1840', edge:'#2b2252', ink:'#efeaff', ink2:'#a99bdd', ink3:'#6c5fa8', accent:'#ff6bcb' } },
};
const THEME_KEY = 'brewlm-mobile-theme';
let currentTheme = 'original';

function applyMobileTheme(id, persist) {
  const t = M_THEMES[id] || M_THEMES.original;
  currentTheme = M_THEMES[id] ? id : 'original';
  const root = document.documentElement;
  for (const [k, val] of Object.entries(t.v)) root.style.setProperty(`--${k}`, val);
  root.style.colorScheme = t.scheme;
  document.body.style.fontFamily = t.font || '';
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', t.v.bg);
  if (persist) try { localStorage.setItem(THEME_KEY, currentTheme); } catch {}
  document.querySelectorAll('.tdot').forEach(d =>
    d.classList.toggle('active', d.dataset.theme === currentTheme));
}
function buildThemeDock() {
  const dock = document.createElement('div');
  dock.className = 'themes';
  dock.id = 'themedock';
  for (const [id, t] of Object.entries(M_THEMES)) {
    const dot = document.createElement('button');
    dot.className = 'tdot';
    dot.dataset.theme = id;
    dot.title = t.name;
    dot.style.backgroundColor = t.v.accent;
    dot.onclick = () => applyMobileTheme(id, true);
    dock.appendChild(dot);
  }
  document.body.appendChild(dock);
}
async function initTheme() {
  buildThemeDock();
  const saved = (() => { try { return localStorage.getItem(THEME_KEY); } catch { return null; } })();
  if (saved && M_THEMES[saved]) return applyMobileTheme(saved, false);
  if (MODE === 'd') {
    try {
      const { theme, scope } = await api('/preferences');
      if (scope) { SCOPE = scope; applyScopeClass(); }
      return applyMobileTheme(M_THEMES[theme] ? theme : 'original', false);
    } catch {}
  }
  applyMobileTheme('original', false);
}

/* -------------------------------- markdown ------------------------------ */
function md(src) {
  if (!src) return '';
  let html = esc(src);
  html = html.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.replace(/^\n+/, '')}</code></pre>`);
  const lines = html.split('\n');
  let out = '', list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  for (let line of lines) {
    if (line.startsWith('<pre>')) { closeList(); out += line + '\n'; continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) { closeList(); out += `<h${m[1].length}>${m[2]}</h${m[1].length}>\n`; continue; }
    if ((m = line.match(/^\s*-\s+(.*)/))) { if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; } out += `<li>${m[1]}</li>`; continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; } out += `<li>${m[1]}</li>`; continue; }
    closeList();
    if (line.trim() === '') continue;
    if (line.startsWith('&gt;')) { out += `<blockquote>${line.slice(4).trim()}</blockquote>\n`; continue; }
    if (/^-{3,}$/.test(line.trim())) { out += '<hr>'; continue; }
    out += `<p>${line}</p>\n`;
  }
  closeList();
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  out = out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return out;
}

const fmtDate = (ms) => new Date(Number(ms)).toLocaleDateString(undefined,
  { month: 'short', day: 'numeric' });

/* -------------------------------- pairing ------------------------------- */
function renderPairing(error = '') {
  document.getElementById('themedock')?.classList.add('hidden');
  $app.innerHTML = `
    <div class="pair-wrap">
      <div class="brand" style="justify-content:center"><div class="dot"></div><h1>BrewLM</h1></div>
      <p style="color:var(--ink2);font-size:14.5px">Enter the 6-digit PIN shown next to the QR code<br>in BrewLM → Settings on your Mac.</p>
      <form id="pinform">
        <input class="field pin" id="pin" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required>
        ${error ? `<p style="color:var(--bad);font-size:13px">${esc(error)}</p>` : ''}
        <button class="btn btn-primary" style="width:100%" type="submit">Pair this device</button>
      </form>
      <p style="color:var(--ink3);font-size:12px;margin-top:18px">This link works once per QR session.<br>Your phone will only ever talk to your Mac.</p>
    </div>`;
  document.getElementById('pinform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = document.getElementById('pin').value.trim();
    try {
      const r = await post('/pair', { pin });
      localStorage.setItem(KEY_STORE, r.device_key);
      location.replace(`/d/${r.device_key}/`);
    } catch (err) {
      renderPairing(err.message === 'Wrong PIN.' ? 'Wrong PIN — check the desktop and try again.'
        : err.message);
    }
  });
}

/* ------------------------------ app shell ------------------------------- */
function shell(inner, title, opts = {}) {
  $app.className = opts.chat ? 'in-chat' : '';
  document.getElementById('themedock')?.classList.toggle('hidden', !!opts.chat);
  $app.innerHTML = `
    <div class="brand"><div class="dot"></div><h1>${esc(title || 'BrewLM')}</h1>${MODE === 'd' && SCOPE !== 'full' ? '<span class="ro-pill">Read-only</span>' : ''}</div>
    ${inner}`;
}

async function guardDevice() {
  try {
    const p = await api('/preferences');
    if (p.scope) { SCOPE = p.scope; applyScopeClass(); }
    return true;
  } catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) {
      localStorage.removeItem(KEY_STORE);
      shell(`<p class="err">This device is no longer paired.<br>Please pair again from BrewLM → Settings → Pair your phone.</p>`);
      return false;
    }
    return true; // transient server hiccup: keep going
  }
}

/* --------------------------------- home --------------------------------- */
let homeNotebooks = null;

async function renderHome() {
  shell(`
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input class="search" id="q" style="margin:0" type="search" placeholder="Search notebooks…" autocomplete="off">
      <button class="btn write-only" id="newnb" title="New notebook">＋</button>
    </div>
    <div id="list"><p class="empty">Loading notebooks…</p></div>
    <div id="sheetroot"></div>`);
  const $list = document.getElementById('list');
  const $q = document.getElementById('q');
  document.getElementById('newnb').onclick = () => {
    const title = prompt('Notebook title?');
    if (!title || !title.trim()) return;
    post('/notebooks', { title: title.trim() })
      .then(() => { homeNotebooks = null; renderHome(); })
      .catch(e => alert(e.message));
  };

  const paint = () => {
    if (!homeNotebooks) return;
    const q = ($q.value || '').trim().toLowerCase();
    const rows = !q ? homeNotebooks : homeNotebooks.filter(nb =>
      nb.title.toLowerCase().includes(q) || (nb.description || '').toLowerCase().includes(q));
    if (!rows.length) {
      $list.innerHTML = `<p class="empty">${q ? `No notebooks match “${esc($q.value.trim())}”.` : 'No notebooks yet.'}</p>`;
      return;
    }
    $list.innerHTML = rows.map(nb => `
      <button class="card" data-id="${esc(nb.id)}">
        <h3>${esc(nb.title)}</h3>
        ${nb.description ? `<p>${esc(nb.description)}</p>` : ''}
        <span class="date">Updated ${fmtDate(nb.updated_at)}</span>
        <span class="menu write-only" data-menu="${esc(nb.id)}">⋯</span>
      </button>`).join('');
    $list.querySelectorAll('.card').forEach(c =>
      c.addEventListener('click', (e) => {
        if (e.target.closest('[data-menu]')) return;
        location.hash = '#nb/' + encodeURIComponent(c.dataset.id);
      }));
    $list.querySelectorAll('[data-menu]').forEach(m =>
      m.addEventListener('click', () => notebookActions(m.dataset.menu)));
  };
  $q.addEventListener('input', paint);

  try {
    homeNotebooks = (await api('/notebooks')).notebooks;
    paint();
  } catch (e) {
    $list.innerHTML = `<p class="err">${esc(e.message)}<br>Is BrewLM still running on your Mac?</p>`;
  }
}

function notebookActions(id) {
  const nb = (homeNotebooks || []).find(n => n.id === id);
  if (!nb) return;
  const root = document.getElementById('sheetroot');
  root.innerHTML = `
    <div class="sheet" id="sheet"><div>
      <h3>${esc(nb.title)}</h3>
      <button class="btn" id="a-rename">Rename</button>
      <button class="btn btn-danger" id="a-del">Move to Trash</button>
      <button class="btn" id="a-cancel" style="float:right">Cancel</button>
    </div></div>`;
  const close = () => root.innerHTML = '';
  root.querySelector('#a-cancel').onclick = close;
  root.querySelector('#sheet').onclick = (e) => { if (e.target.id === 'sheet') close(); };
  root.querySelector('#a-rename').onclick = () => {
    const t = prompt('New title?', nb.title);
    if (!t || !t.trim()) return close();
    post(`/notebooks/${encodeURIComponent(id)}/rename`, { title: t.trim() })
      .then(() => { homeNotebooks = null; close(); renderHome(); })
      .catch(e => alert(e.message));
  };
  root.querySelector('#a-del').onclick = () => {
    if (!confirm(`Move "${nb.title}" to Trash? (recoverable on the desktop)`)) return close();
    post(`/notebooks/${encodeURIComponent(id)}/delete`, {})
      .then(() => { homeNotebooks = null; close(); renderHome(); })
      .catch(e => alert(e.message));
  };
}

/* ------------------------------ notebook view ---------------------------- */
const nbState = {}; // id -> {tab, chatId}

async function renderNotebook(id) {
  const st = nbState[id] || (nbState[id] = { tab: 'chat', chatId: null });
  shell('<p class="empty">Loading…</p>');
  let nb;
  try { nb = await api(`/notebooks/${encodeURIComponent(id)}`); }
  catch (e) { return shell(`<p class="err">${esc(e.message)}</p>`); }

  const tabs = `<div class="tabs">
    ${['chat', 'studio', 'sources'].map(t =>
      `<div class="tab ${st.tab === t ? 'active' : ''}" data-tab="${t}">${t === 'chat' ? 'Chat' : t === 'studio' ? 'Studio' : 'Sources'}</div>`).join('')}
  </div>`;
  const header = `<button class="back" onclick="location.hash=''">‹ All notebooks</button>
    <h2 style="margin:0 0 2px;font-size:19px">${esc(nb.title)}</h2>`;

  shell(`${header}${tabs}<div id="pane"></div>`, nb.title, { chat: st.tab === 'chat' });
  if (st.tab !== 'chat') document.getElementById('composer')?.remove();
  $app.querySelectorAll('.tab').forEach(t => t.onclick = () => { st.tab = t.dataset.tab; renderNotebook(id); });

  const pane = document.getElementById('pane');
  if (st.tab === 'chat') renderChatTab(pane, nb, st);
  else if (st.tab === 'studio') renderStudioTab(pane, nb, st);
  else renderSourcesTab(pane, nb, st);
}

/* -------------------------------- chat tab ------------------------------ */
async function renderChatTab(pane, nb, st) {
  pane.innerHTML = '<p class="empty">Loading chat…</p>';
  let chats = [];
  try { chats = (await api(`/notebooks/${encodeURIComponent(nb.id)}/chats`)).chats; }
  catch (e) { pane.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  if (!chats.find(c => c.id === st.chatId)) st.chatId = chats[0]?.id ?? null;

  const chatBar = `<div class="chips">
    ${chats.slice(0, 5).map(c => `<span class="chip ${c.id === st.chatId ? 'active' : ''}" data-chat="${esc(c.id)}">${esc(c.title)}</span>`).join('')}
    <span class="chip write-only" data-newchat>＋ New chat</span>
  </div>`;
  pane.innerHTML = `${chatBar}<div id="msgs"></div>`;
  pane.querySelectorAll('[data-chat]').forEach(el => el.onclick = () => { st.chatId = el.dataset.chat; renderNotebook(nb.id); });
  pane.querySelector('[data-newchat]').onclick = () => { st.chatId = null; renderMsgs(); };

  const $msgs = pane.querySelector('#msgs');
  let sending = false;

  async function renderMsgs() {
    if (!st.chatId) { $msgs.innerHTML = `<p class="empty">${SCOPE !== 'full' ? 'Chats appear here — pick an existing one above.' : 'Say something to start a new chat — answers cite your sources.'}</p>`; return; }
    let msgs = [];
    try { msgs = (await api(`/chats/${encodeURIComponent(st.chatId)}/messages`)).messages; }
    catch (e) { $msgs.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    $msgs.innerHTML = msgs.length ? msgs.map(m => `
      <div class="msg ${m.role === 'user' ? 'user' : 'bot'}"><div class="body-md">${m.role === 'user' ? esc(m.content) : md(m.content)}</div></div>`
    ).join('') : '<p class="empty">No messages yet.</p>';
    window.scrollTo(0, document.body.scrollHeight);
  }
  await renderMsgs();

  let composer = document.getElementById('composer');
  if (composer) composer.remove();
  composer = document.createElement('div');
  composer.className = 'composer write-only'; composer.id = 'composer';
  composer.innerHTML = `<div class="row">
    <textarea rows="1" placeholder="Ask this notebook…" id="cta"></textarea>
    <button id="csend">Send</button></div>`;
  document.body.appendChild(composer);
  const ta = composer.querySelector('#cta');
  const btn = composer.querySelector('#csend');
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(110, ta.scrollHeight) + 'px'; });

  btn.onclick = async () => {
    const text = ta.value.trim();
    if (!text || sending) return;
    sending = true; btn.disabled = true; ta.value = '';
    $msgs.insertAdjacentHTML('beforeend',
      `<div class="msg user"><div class="body-md">${esc(text)}</div></div>
       <div class="msg bot thinking" id="thinking">BrewLM is thinking…</div>`);
    window.scrollTo(0, document.body.scrollHeight);
    try {
      const { job_id } = await post('/chat', { notebook_id: nb.id, content: text, chat_id: st.chatId });
      const job = await pollJob(job_id, 120);
      if (job.status !== 'done') throw new Error(job.result || 'Chat failed.');
      const result = JSON.parse(job.result || '{}');
      if (result.chat_id) st.chatId = result.chat_id;
      await renderMsgs();
    } catch (e) {
      document.getElementById('thinking')?.remove();
      $msgs.insertAdjacentHTML('beforeend',
        `<div class="msg bot thinking" style="color:var(--bad)">${esc(e.message)}</div>`);
    } finally { sending = false; btn.disabled = false; ta.focus(); }
  };
}

/* ------------------------------- studio tab ----------------------------- */
const GEN_TOOLS = [
  { kind: 'flashcards', label: 'Flashcards', opts: [['amount', ['compact', 'default', 'more']], ['difficulty', ['easy', 'medium', 'hard']], ['focus', 'text']] },
  { kind: 'quiz', label: 'Quiz', opts: [['amount', ['compact', 'default', 'more']], ['difficulty', ['easy', 'medium', 'hard']], ['focus', 'text']] },
  { kind: 'mindmap', label: 'Mind map', opts: [['focus', 'text']] },
  { kind: 'report', label: 'Report', opts: [['report_type', ['study-guide', 'briefing-doc', 'analysis']]] },
  { kind: 'research', label: 'Deep research', opts: [['topic', 'text']] },
  { kind: 'audio', label: 'Audio overview', opts: [['format', ['deep-dive', 'brief', 'debate', 'critique']], ['length', ['short', 'standard', 'long']], ['focus', 'text']] },
];
const GEN_OPT_DEFAULT = { amount: 1, difficulty: 1, format: 0, length: 1, report_type: 0 };
const activeJobs = {}; // jobId -> {label}

async function pollJob(id, maxSeconds) {
  const deadline = Date.now() + maxSeconds * 1000;
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 2000));
    const job = await api(`/jobs/${encodeURIComponent(id)}`);
    if (job.status === 'done' || job.status === 'error') return job;
    if (activeJobs[id]) activeJobs[id].el && (activeJobs[id].el.querySelector('.p').textContent = job.progress || 'Working…');
  }
  throw new Error('Timed out waiting for the desktop — is BrewLM open there?');
}

function renderStudioTab(pane, nb) {
  const groups = { audio: [], docs: [], flashcards: [], quiz: [], mindmap: [] };
  for (const a of nb.artifacts) {
    if (a.kind === 'audio') groups.audio.push(a);
    else if (a.kind === 'flashcards') groups.flashcards.push(a);
    else if (a.kind === 'quiz') groups.quiz.push(a);
    else if (a.kind === 'mindmap') groups.mindmap.push(a);
    else groups.docs.push(a);
  }
  const artCard = (a, body) => `<div class="card"><h3>${esc(a.title)}<span class="pill">${a.kind}</span></h3>${body}</div>`;
  let h = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button class="btn btn-primary write-only" id="gen-open">＋ Generate</button></div>
    <div id="jobs"></div>`;
  if (groups.audio.length) {
    h += `<div class="sec">Audio overviews</div>`;
    for (const a of groups.audio) h += artCard(a, `
      <audio controls preload="none" data-title="${esc(a.title)}"
        src="${BASE}/api/artifacts/${encodeURIComponent(a.id)}/audio"></audio>
      <details><summary>Read the script</summary><div class="body-md" data-script="${esc(a.id)}"></div></details>`);
  }
  if (groups.docs.length) {
    h += `<div class="sec">Documents</div>`;
    for (const a of groups.docs) h += artCard(a, `<div class="body-md" data-doc="${esc(a.id)}"><p class="empty">Tap to load…</p></div>`);
  }
  if (groups.flashcards.length) {
    h += `<div class="sec">Flashcards</div>`;
    for (const a of groups.flashcards) h += artCard(a, `<div data-fc="${esc(a.id)}"><p class="empty">Tap to load deck…</p></div>`);
  }
  if (groups.quiz.length) {
    h += `<div class="sec">Quizzes</div>`;
    for (const a of groups.quiz) h += artCard(a, `<div data-quiz="${esc(a.id)}"><p class="empty">Tap to load quiz…</p></div>`);
  }
  if (groups.mindmap.length) {
    h += `<div class="sec">Mind maps</div>`;
    for (const a of groups.mindmap) h += artCard(a, `<div class="body-md" data-doc="${esc(a.id)}"><p class="empty">Tap to load…</p></div>`);
  }
  if (!nb.artifacts.length) h += `<p class="empty">${SCOPE !== 'full' ? 'Nothing here yet.' : 'Nothing here yet — tap ＋ Generate to create something from your sources.'}</p>`;
  h += '<div id="sheetroot"></div>';
  pane.innerHTML = h;

  pane.querySelectorAll('[data-doc]').forEach(el => el.parentElement.addEventListener('click', () => loadDoc(el), { once: true }));
  pane.querySelectorAll('[data-fc]').forEach(el => el.parentElement.addEventListener('click', () => loadCards(el), { once: true }));
  pane.querySelectorAll('[data-quiz]').forEach(el => el.parentElement.addEventListener('click', () => loadQuiz(el), { once: true }));
  pane.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => {
    if (d.open) { const el = d.querySelector('[data-script]'); if (el && !el.dataset.done) loadScript(el); }
  }));
  pane.querySelectorAll('audio').forEach(a => a.addEventListener('play', () => {
    if ('mediaSession' in navigator)
      navigator.mediaSession.metadata = new MediaMetadata({ title: a.dataset.title || 'Audio overview', artist: nb.title, album: 'BrewLM' });
  }));

  pane.querySelector('#gen-open').onclick = () => generateSheet(pane, nb);
}

function generateSheet(pane, nb) {
  const root = pane.querySelector('#sheetroot');
  let picked = null;
  root.innerHTML = `<div class="sheet" id="sheet"><div>
    <h3>Generate</h3>
    <div class="chips" id="tools">
      ${GEN_TOOLS.map(t => `<span class="chip" data-kind="${t.kind}">${t.label}</span>`).join('')}
    </div>
    <div id="optrows"></div>
    <div style="margin-top:6px">
      <button class="btn btn-primary" id="go" disabled>Generate</button>
      <button class="btn" id="cancel">Cancel</button>
    </div></div></div>`;
  const close = () => root.innerHTML = '';
  root.querySelector('#cancel').onclick = close;
  root.querySelector('#sheet').onclick = (e) => { if (e.target.id === 'sheet') close(); };
  const go = root.querySelector('#go');
  root.querySelectorAll('[data-kind]').forEach(chip => chip.onclick = () => {
    root.querySelectorAll('[data-kind]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    picked = GEN_TOOLS.find(t => t.kind === chip.dataset.kind);
    root.querySelector('#optrows').innerHTML = picked.opts.map(([key, vals]) => {
      if (vals === 'text') {
        return `<input class="field" data-opt="${key}" placeholder="${key === 'topic' ? 'Topic to research…' : 'Focus (optional)…'}">`;
      }
      const def = GEN_OPT_DEFAULT[key] ?? 0;
      return `<div class="chips" data-opt-group="${key}">${vals.map((v, i) =>
        `<span class="chip ${i === def ? 'active' : ''}" data-val="${v}">${v}</span>`).join('')}</div>`;
    }).join('');
    root.querySelectorAll('[data-opt-group] .chip').forEach(c => c.onclick = () => {
      c.parentElement.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
    });
    go.disabled = false;
  });
  go.onclick = async () => {
    if (!picked) return;
    const options = {};
    for (const [key, vals] of picked.opts) {
      options[key] = vals === 'text'
        ? root.querySelector(`[data-opt="${key}"]`)?.value.trim() || ''
        : root.querySelector(`[data-opt-group="${key}"] .chip.active`)?.dataset.val || '';
    }
    if (picked.kind === 'research' && !options.topic) { alert('Research needs a topic.'); return; }
    close();
    try {
      const { job_id } = await post('/generate', { notebook_id: nb.id, kind: picked.kind, options });
      const jobsEl = pane.querySelector('#jobs');
      jobsEl.insertAdjacentHTML('afterbegin',
        `<div class="job-pill" id="job-${job_id}">⏳ <strong>${picked.label}</strong> — <span class="p">Queued…</span></div>`);
      activeJobs[job_id] = { label: picked.label, el: document.getElementById(`job-${job_id}`) };
      const job = await pollJob(job_id, picked.kind === 'audio' || picked.kind === 'research' ? 600 : 180);
      document.getElementById(`job-${job_id}`)?.remove();
      delete activeJobs[job_id];
      if (job.status !== 'done') alert(job.result || 'Generation failed.');
      renderNotebook(nb.id);
    } catch (e) { alert(e.message); renderNotebook(nb.id); }
  };
}

async function loadDoc(el) {
  el.innerHTML = '<p class="empty">Loading…</p>';
  try {
    const a = await api(`/artifacts/${encodeURIComponent(el.dataset.doc)}`);
    let text;
    if (a.kind === 'research' && typeof a.data === 'object') {
      text = md(a.data.md) + (a.data.sources?.length
        ? `<div class="sec">Sources read</div>` + a.data.sources.map(s =>
            `<p style="font-size:13px"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title || s.url)}</a></p>`).join('')
        : '');
    } else {
      text = md(typeof a.data === 'string' ? a.data : '```' + JSON.stringify(a.data, null, 2) + '```');
    }
    el.innerHTML = text || '<p class="empty">Empty.</p>';
  } catch (e) { el.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function loadScript(el) {
  el.dataset.done = '1';
  el.innerHTML = '<p class="empty">Loading…</p>';
  try {
    const a = await api(`/artifacts/${encodeURIComponent(el.dataset.script)}`);
    const d = a.data;
    let script = '';
    if (typeof d === 'object' && d) {
      if (Array.isArray(d.script))
        script = d.script.map(t => `**${t.speaker}:** ${t.text}`).join('\n');
      else if (typeof d.script === 'string') script = d.script;
    }
    el.innerHTML = md(script) || '<p class="empty">No script saved.</p>';
  } catch (e) { el.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function loadCards(el) {
  el.innerHTML = '<p class="empty">Loading…</p>';
  let cards = [];
  try {
    const a = await api(`/artifacts/${encodeURIComponent(el.dataset.fc)}`);
    cards = typeof a.data === 'string' ? JSON.parse(a.data) : a.data;
  } catch (e) { return el.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  if (!Array.isArray(cards) || !cards.length) return el.innerHTML = '<p class="empty">No cards.</p>';
  el.innerHTML = cards.map(c => `
    <button class="card flip" onclick="this.classList.toggle('flipped')">
      <span class="inner">
        <span class="face">${esc(c.front)}<span class="hint">tap to flip</span></span>
        <span class="face back-face">${esc(c.back)}</span>
      </span>
    </button>`).join('');
}

async function loadQuiz(el) {
  el.innerHTML = '<p class="empty">Loading…</p>';
  let qs = [];
  try {
    const a = await api(`/artifacts/${encodeURIComponent(el.dataset.quiz)}`);
    qs = typeof a.data === 'string' ? JSON.parse(a.data) : a.data;
  } catch (e) { return el.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  if (!Array.isArray(qs) || !qs.length) return el.innerHTML = '<p class="empty">No questions.</p>';
  let done = 0, right = 0;
  el.innerHTML = `<span class="score" data-score></span>` + qs.map((q, i) => `
    <div class="card" style="cursor:default">
      <p><strong>${i + 1}.</strong> ${esc(q.question)}</p>
      ${q.options.map((o, j) => `<button class="q-opt" data-q="${i}" data-j="${j}">${esc(o)}</button>`).join('')}
      <div class="q-exp" data-exp="${i}" hidden></div>
    </div>`).join('');
  const scoreEl = el.querySelector('[data-score]');
  const upd = () => scoreEl.textContent = done ? `Score: ${right}/${done}` : '';
  upd();
  el.querySelectorAll('.q-opt').forEach(btn => btn.addEventListener('click', () => {
    const qEl = btn.closest('.card');
    if (qEl.dataset.answered) return;
    qEl.dataset.answered = '1';
    const q = qs[Number(btn.dataset.q)];
    const isRight = Number(btn.dataset.j) === Number(q.answerIndex);
    done++; if (isRight) right++;
    qEl.querySelectorAll('.q-opt').forEach(b => {
      if (Number(b.dataset.j) === Number(q.answerIndex)) b.classList.add('correct');
    });
    if (!isRight) btn.classList.add('wrong');
    const exp = qEl.querySelector(`[data-exp]`);
    exp.hidden = false;
    exp.textContent = q.explanation || '';
    upd();
  }));
}

/* ------------------------------ sources tab ----------------------------- */
function renderSourcesTab(pane, nb, st) {
  let h = `
    <div class="write-only">
    <div class="sec">Add a source</div>
    <div class="card" style="cursor:default">
      <input class="field" id="src-title" placeholder="Note title (optional)">
      <textarea class="field" id="src-text" placeholder="Paste or write a note…"></textarea>
      <button class="btn btn-primary" id="src-add">Add note</button>
    </div>
    <div class="card" style="cursor:default">
      <input class="field" id="src-url" placeholder="https://… — fetch a webpage into sources">
      <button class="btn btn-primary" id="src-fetch">Fetch link</button>
    </div>
    </div>
    <div class="sec">Sources · ${nb.sources.length}</div>
    ${nb.sources.map(s => `<div class="card src-item"><p class="t">📄 ${esc(s.title)}</p>
      <span class="date">${esc(s.type)} · ${fmtDate(s.created_at)}</span></div>`).join('') || '<p class="empty">No sources yet.</p>'}`;
  pane.innerHTML = h;

  pane.querySelector('#src-add').onclick = async (e) => {
    const text = pane.querySelector('#src-text').value.trim();
    if (!text) return;
    e.target.disabled = true;
    try {
      await post(`/notebooks/${encodeURIComponent(nb.id)}/sources/text`, {
        title: pane.querySelector('#src-title').value.trim(), text });
      renderNotebook(nb.id);
    } catch (err) { alert(err.message); e.target.disabled = false; }
  };
  pane.querySelector('#src-fetch').onclick = async (e) => {
    const url = pane.querySelector('#src-url').value.trim();
    if (!url) return;
    e.target.disabled = true; e.target.textContent = 'Fetching…';
    try {
      await post(`/notebooks/${encodeURIComponent(nb.id)}/sources/url`, { url });
      renderNotebook(nb.id);
    } catch (err) { alert(err.message); e.target.disabled = false; e.target.textContent = 'Fetch link'; }
  };
}

/* --------------------------------- router -------------------------------- */
function route() {
  if (MODE === 'p') return renderPairing();
  const h = location.hash;
  if (h.startsWith('#nb/')) renderNotebook(decodeURIComponent(h.slice(4)));
  else renderHome();
}
window.addEventListener('hashchange', () => {
  document.getElementById('composer')?.remove();
  route();
});

(async () => {
  await initTheme();
  if (MODE === 'd' && !(await guardDevice())) return;
  route();
})();
</script>
