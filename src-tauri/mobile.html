<title>BrewLM</title>
<!-- The desktop's renderer for replies and documents (math, tables, drawings); see server.rs asset_handler. -->

<style>
  :root {
    /* Overridden by JS theme switcher; defaults = "brew" (desktop default). */
    --bg: #fff8f3; --panel: #ffffff; --panel2: #f9ece2; --edge: #f3e1d4;
    --ink: #2b1709; --ink2: #76503e; --ink3: #8d6e5a; --accent: #f2541b; --on-accent: var(--bg);
    --good: #15803d; --bad: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background .2s, color .2s; }
  #app { max-width: 680px; margin: 0 auto; padding: 14px 14px 110px;
    padding-top: calc(14px + env(safe-area-inset-top)); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
  .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .brand h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .brand .ro-pill { margin-left: auto; font-size: 11px; color: var(--accent);
    border: 1px solid var(--edge); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  body.readonly .write-only { display: none !important; }
  .btn { display: inline-block; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .btn-danger { color: var(--bad); }
  .btn:disabled { opacity: .5; }
  .tts-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .tts-row[hidden] { display: none; }
  .tts-status { font-size: 12.5px; color: var(--ink2); }
  .search, .field { width: 100%; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 15px;
    outline: none; margin-bottom: 10px; }
  .search { border-radius: 999px; }
  .search::placeholder, .field::placeholder { color: var(--ink3); }
  .search:focus, .field:focus { border-color: var(--accent); }
  textarea.field { min-height: 110px; resize: vertical; font-family: inherit; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px; display: block; width: 100%; text-align: left;
    color: var(--ink); cursor: pointer; position: relative; }
  .card:active { background: var(--panel2); }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card p { margin: 0; color: var(--ink2); font-size: 13px; }
  .card .date { color: var(--ink3); font-size: 11.5px; margin-top: 6px; display: block; }
  .card .menu { position: absolute; top: 10px; right: 12px; color: var(--ink3);
    font-size: 20px; padding: 2px 8px; }
  .back { color: var(--accent); background: none; border: none; font-size: 15px;
    padding: 8px 0; margin-bottom: 6px; cursor: pointer; }
  .sec { color: var(--ink3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
    margin: 20px 0 8px; }
  .pill { display: inline-block; font-size: 10.5px; color: var(--accent); border: 1px solid var(--edge);
    border-radius: 999px; padding: 1px 7px; margin-left: 8px; vertical-align: 2px; }
  audio { width: 100%; margin-top: 10px; display: block; }
  details { margin-top: 8px; }
  summary { color: var(--accent); font-size: 13.5px; cursor: pointer; }
  .body-md { font-size: 14.5px; color: var(--ink); }
  .body-md h1, .body-md h2, .body-md h3 { margin: 16px 0 6px; line-height: 1.25; }
  .body-md h1 { font-size: 19px; } .body-md h2 { font-size: 17px; } .body-md h3 { font-size: 15px; }
  .body-md p { margin: 8px 0; color: var(--ink2); }
  .body-md a { color: var(--accent); }
  .body-md code { background: var(--panel2); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .body-md pre { background: var(--panel2); border: 1px solid var(--edge); border-radius: 10px;
    padding: 10px; overflow-x: auto; font-size: 12.5px; }
  .body-md pre code { background: none; padding: 0; }
  .body-md ul, .body-md ol { margin: 8px 0; padding-left: 22px; color: var(--ink2); }
  .body-md li { margin: 3px 0; }
  .body-md blockquote { border-left: 3px solid var(--edge); margin: 8px 0; padding-left: 12px; color: var(--ink3); }
  .flip { perspective: 600px; text-align: center; font-family: inherit; }
  .flip .inner { transition: transform .3s; transform-style: preserve-3d; display: grid; min-height: 120px; }
  .flip .inner > * { grid-area: 1 / 1; }
  .flip.flipped .inner { transform: rotateY(180deg); }
  .flip .face { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 6px 4px; text-align: center; font-size: 15.5px; line-height: 1.55;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip .face .hint { font-size: 11.5px; color: var(--ink3); }
  .flip .back-face { transform: rotateY(180deg); color: var(--ink2); font-size: 14.5px; }
  .q-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--edge); background: var(--panel2);
    color: var(--ink); font-size: 14.5px; cursor: pointer; }
  .q-opt.correct { border-color: var(--good); background: rgba(94,166,114,.15); }
  .q-opt.wrong { border-color: var(--bad); background: rgba(201,106,94,.15); }
  .q-exp { margin-top: 8px; font-size: 13px; color: var(--ink2); border-top: 1px dashed var(--edge);
    padding-top: 8px; }
  .empty { color: var(--ink3); font-size: 13.5px; }
  .err { color: var(--bad); padding: 30px 0; text-align: center; }
  .score { float: right; font-size: 12px; color: var(--accent); }
  /* Tabs */
  .tabs { display: flex; gap: 6px; margin: 10px 0 14px; }

    cursor: pointer; border: 1px solid var(--edge); background: var(--panel); color: var(--ink2); }
  .tab.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  /* Chat */
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; margin-bottom: 10px; font-size: 14.5px; }
  .msg.user { margin-left: auto; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--panel); border: 1px solid var(--edge); border-bottom-left-radius: 4px; }
  .msg.bot .body-md { font-size: 14.5px; }
  .msg.thinking { color: var(--ink3); font-style: italic; }
  .msg .gen-img { display: block; max-width: 100%; max-height: 360px; border-radius: 10px; margin: 6px 0; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--bg); border-top: 1px solid var(--edge);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .composer .row { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; }
  .composer textarea { flex: 1; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); border-radius: 18px; padding: 10px 14px; font-size: 15px; max-height: 110px;
    outline: none; resize: none; font-family: inherit; }
  .composer button { border-radius: 999px; border: none; background: var(--accent); color: var(--on-accent);
    padding: 0 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .composer button:disabled { opacity: .5; }
  .composer #csend.stop { background: var(--panel2); color: var(--ink); border: 1px solid var(--edge); }
  /* Thinking effort: brain button + menu beside Send */
  .composer .think-wrap { position: relative; flex: none; display: flex; }
  .composer .think { background: transparent; color: var(--ink3); padding: 0 10px; min-width: 42px;
    display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600; }
  .composer .think.set { color: var(--ink2); }
  .composer .think[aria-expanded="true"] { background: var(--panel2); color: var(--ink); }
  .composer .think svg { width: 19px; height: 19px; flex: none; }
  .think-menu { position: absolute; right: 0; bottom: calc(100% + 8px); width: 236px; z-index: 50;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 4px 0;
    box-shadow: 0 8px 28px rgba(0,0,0,.18); }
  .think-menu .hd { margin: 0; padding: 6px 14px 4px; font-size: 10.5px; font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); }
  .composer .think-menu button { display: flex; width: 100%; gap: 8px; align-items: flex-start; text-align: left;
    background: transparent; color: var(--ink2); border-radius: 0; padding: 8px 14px; font-weight: 400; }
  .composer .think-menu button[aria-checked="true"] { color: var(--ink); }
  .think-menu .ck { width: 14px; flex: none; padding-top: 1px; font-size: 13px; }
  .think-menu .nm { display: block; font-size: 14px; font-weight: 600; }
  .think-menu .ds { display: block; font-size: 12px; color: var(--ink3); }
  #app.in-chat { padding-bottom: 100px; }
  /* Sheets & misc */
  .sheet { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; }
  .sheet > div { background: var(--panel); border-radius: 18px 18px 0 0; width: 100%;
    max-width: 680px; margin: 0 auto; padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
    max-height: 80vh; overflow-y: auto; }
  .sheet h3 { margin: 0 0 10px; }
  .sheet .btn { margin: 0 8px 8px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--edge); background: var(--panel2); color: var(--ink2);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
  .chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .job-pill { background: var(--panel2); border: 1px dashed var(--edge); border-radius: 12px;
    padding: 10px 14px; font-size: 13px; color: var(--ink2); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px; }
  .job-pill .txt { flex: 1; min-width: 0; }
  .job-pill .x { flex: none; width: 28px; height: 28px; margin: -4px -6px -4px 0; border: 0; border-radius: 8px;
    background: transparent; color: var(--ink3); font-size: 18px; line-height: 1; cursor: pointer; }
  .job-pill .x:disabled { opacity: .4; }
  .src-item .t { font-size: 14px; }
  .card.has-menu > h3, .card.has-menu > .t { padding-right: 30px; }
  .pin-pill { color: var(--ink3); }
  .msg .save-src { display: inline-block; margin-top: 6px; border: 0; background: none; padding: 2px 0;
    color: var(--accent); font: inherit; font-size: 12.5px; cursor: pointer; }
  .msg .save-src:disabled { color: var(--ink3); cursor: default; }
  .sheet .actions .btn { display: block; width: 100%; text-align: left; margin: 0 0 8px; }
  /* Home: toolbar, notebook cards with covers and stars, the Trash */
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .toolbar[hidden] { display: none; }
  .toolbar .search { margin: 0; }
  .toolbar .btn { flex: none; }
  .nb-card { display: flex; gap: 12px; align-items: flex-start; }
  .nb-card .cover { width: 56px; height: 56px; flex: none; object-fit: cover; border-radius: 10px; background: var(--panel2); }
  .nb-card .nb-text { flex: 1; min-width: 0; }
  .nb-card .star { color: var(--accent); }
  .trash-card { cursor: default; }
  /* Forms in sheets */
  .flabel { display: block; font-size: 12px; color: var(--ink3); margin: 2px 0 4px; }
  .hint { font-size: 12px; color: var(--ink3); margin: 6px 0 0; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink2); margin: 0 0 12px; }
  .src-pick { max-height: 30vh; overflow-y: auto; border: 1px solid var(--edge); border-radius: 12px; padding: 6px 10px; margin-bottom: 10px; }
  .src-pick label { display: flex; gap: 8px; align-items: center; padding: 6px 0; font-size: 14px; color: var(--ink2); }
  #src-progress { font-size: 13px; color: var(--ink2); margin-top: 6px; }
  /* Flashcards, one at a time */
  .deck { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .deck-card { width: 100%; min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 20px; border: 1px solid var(--edge); border-radius: 16px; background: var(--bg); color: var(--ink);
    font: inherit; text-align: center; cursor: pointer; }
  .deck-card.flipped { background: var(--panel2); }
  .deck-label { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }
  .deck-text { font-size: 16px; line-height: 1.55; }
  .deck-nav { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink3); }
  .deck-nav button { width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--edge); background: var(--panel);
    color: var(--ink); font-size: 18px; cursor: pointer; }
  .deck-nav button:disabled { opacity: .35; }
  /* Mind map editing */
  .mm-tools { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .mm-tools .btn { padding: 4px 12px; font-size: 13px; }
  .mm.editing .lb, .mm.editing .root { text-decoration: underline dotted var(--ink3); text-underline-offset: 3px; cursor: pointer; }
  /* /queue: what's lined up, above the composer */
  .composer .queue { max-width: 680px; margin: 0 auto 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .composer .queue[hidden] { display: none; }
  .composer .queue button { background: none; color: var(--ink3); padding: 0 0 0 4px; font-size: 14px; }
  /* The desktop renderer's output (render.js) in bubbles and documents */
  .body-md .md-table { max-width: 100%; overflow-x: auto; margin: 6px 0 10px; }
  .body-md table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .body-md th { text-align: left; font-weight: 600; padding: 5px 8px; border-bottom: 1px solid var(--edge); }
  .body-md td { padding: 5px 8px; border-bottom: 1px solid var(--edge); vertical-align: top; color: var(--ink2); }
  .body-md tr:last-child td { border-bottom: 0; }
  .body-md .katex { font-size: 1.04em; max-width: 100%; }
  .body-md .katex-display { margin: 8px 0; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
  .body-md img { display: block; max-width: 100%; max-height: 360px; border-radius: 10px; margin: 6px 0; }
  .body-md .svg-embed { margin: 6px 0; } .body-md .svg-embed svg { max-width: 100%; height: auto; }
  .body-md .mermaid-block:not(.mermaid-done) { white-space: pre-wrap; font: 12px ui-monospace, Menlo, monospace;
    color: var(--ink3); background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
  .body-md .mermaid-block.mermaid-done { background: #fff; border-radius: 10px; padding: 8px; overflow-x: auto; margin: 6px 0; }
  .body-md .mermaid-block svg { max-width: 100%; height: auto; }
  .body-md hr { border: 0; border-top: 1px solid var(--edge); margin: 12px 0; }
  /* Reasoning, usage line, picture actions, phone-only notes */

  .msg .reasoning summary { font-size: 12.5px; color: var(--ink3); }
  .msg .reasoning .body-md { font-size: 13px; color: var(--ink3); border-left: 2px solid var(--edge); padding-left: 10px; margin-top: 4px; }
  .msg .details { margin: 6px 0 0; font-size: 11.5px; color: var(--ink3); }
  .img-acts { display: flex; gap: 6px; flex-wrap: wrap; margin: -2px 0 8px; }
  .img-acts button { border: 1px solid var(--edge); background: var(--panel2); color: var(--ink2); border-radius: 999px;
    padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .msg.note { background: var(--panel2); border-style: dashed; }

  .fcard { border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--bg); }

  .fcard .fw { display: block; font-size: 12.5px; color: var(--ink2); margin-top: 4px; }
  .fcard .btn, .fetch > .btn { margin-top: 8px; padding: 5px 12px; font-size: 12.5px; }
  /* The "/" and "@" picker above the composer */

    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 4px 0; }
  .pick[hidden] { display: none; }
  .composer .pick button { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink);
    border-radius: 0; padding: 8px 14px; font-weight: 400; }
  .pick .pl { display: block; font-size: 14px; font-weight: 600; }
  .pick .pd { display: block; font-size: 12px; color: var(--ink3); }
  /* Source viewer */
  .sheet .meta { color: var(--ink3); font-size: 12.5px; margin: -4px 0 10px; overflow-wrap: anywhere; }
  .sheet .meta a { color: var(--accent); }
  .src-img { display: block; max-width: 100%; max-height: 300px; border-radius: 10px; margin: 8px 0; }
  .src-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.55; color: var(--ink2);
    background: var(--panel2); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; margin: 6px 0 12px; }
  /* Chat list sheet */
  .chat-row { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--edge); }
  .chat-row .open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; color: var(--ink);

  .chat-row.active .open { color: var(--accent); font-weight: 600; }
  .sheet .chat-row .btn { margin: 0; padding: 5px 10px; font-size: 13px; flex: none; }
  /* Mind maps: a collapsible tree */

  .mm .root { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin: 2px 0 6px; }
  .mm .root::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }

  .mm ul { list-style: none; margin: 0 0 0 4px; padding: 0 0 0 12px; border-left: 1px solid var(--edge); }
  .mm li { position: relative; padding: 4px 0 4px 10px; }

  .mm .lb { font-weight: 600; }

  .mm .nt { display: block; color: var(--ink3); font-size: 12.5px; margin-top: 1px; }
  .mm summary + .nt { margin-left: 14px; }
  /* Interactive pages: full-screen sandboxed viewer */
  .viewer { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; }
  .viewer .bar { display: flex; align-items: center; gap: 10px; background: var(--panel);

  .viewer .bar h3 { flex: 1; min-width: 0; margin: 0; font-size: 15px;

  .viewer iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: var(--bg); }
  .viewer .warn { font-size: 12.5px; color: var(--bad); background: var(--panel); border-top: 1px solid var(--edge);
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); }
  .viewer .warn[hidden] { display: none; }

    bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 50;
    display: flex; gap: 9px; padding: 9px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--edge);
    box-shadow: 0 6px 24px rgba(0,0,0,.22); }
